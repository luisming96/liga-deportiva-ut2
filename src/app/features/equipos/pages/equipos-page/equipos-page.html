<header class="cabecera-pagina">
  <div class="container">
    <h1>Equipos</h1>
    <p>Equipos de cada competición.</p>
  </div>
</header>

<main class="container my-4">
  <div class="row row-cols-1 row-cols-md-2 g-3">
    @for (equipo of equipos; track equipo.nombre) {
      <div class="col">
        <article class="card card-hover h-100 text-center">
          <div class="card-body">
            <h2 class="h5">{{ equipo.nombre }}</h2>
            <p class="text-muted">{{ equipo.curso }}</p>
            <p>Capitán: {{ equipo.capitan }}</p>
          </div>
        </article>
      </div>
    }
  </div>
</main>
